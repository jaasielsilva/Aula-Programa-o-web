<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <main>
        <p>Aluno: <strong>Jaasiel Miranda Da Silva</strong></p>

        <table id="tabela-vendas" border="1">
            <thead>
                <tr>
                    <th>Mês</th>
                    <th>Receitas</th>
                    <th>Despesas</th>
                    <th>Lucro</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Janeiro</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Fevereiro</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Março</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Abril</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Maio</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Junho</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Julho</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Agosto</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Setembro</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Outubro</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Novembro</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
                <tr><td>Dezembro</td><td><input type="number" class="receitas" value="0"></td><td><input type="number" class="despesas" value="0"></td><td class="lucro">0</td></tr>
            </tbody>
            <tfoot>
                <tr>
                    <td>Total do ano</td>
                    <td id="total-receitas">0</td>
                    <td id="total-despesas">0</td>
                    <td id="total-lucro">0</td>
                </tr>
            </tfoot>
        </table>
    </main>

    <script src="../../js/script.js"></script>
    <script>
        function calcularTotais() {
            const linhas = document.querySelectorAll('#tabela-vendas tbody tr');
            let totalReceitas = 0;
            let totalDespesas = 0;
            let totalLucro = 0;

            linhas.forEach((linha) => {
                const receitaMes = Number(linha.querySelector('.receitas').value) || 0;
                const despesaMes = Number(linha.querySelector('.despesas').value) || 0;
                const lucroMes = receitaMes - despesaMes;

                linha.querySelector('.lucro').textContent = lucroMes;

                totalReceitas += receitaMes;
                totalDespesas += despesaMes;
                totalLucro += lucroMes;
            });

            document.getElementById('total-receitas').textContent = totalReceitas;
            document.getElementById('total-despesas').textContent = totalDespesas;
            document.getElementById('total-lucro').textContent = totalLucro;
        }

        document.querySelectorAll('.receitas, .despesas').forEach((input) => {
            input.addEventListener('input', calcularTotais);
        });

        calcularTotais();
    </script>
</body>
</html>
